name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only the maintainer can start Claude. The action's own write-access check runs inside the
    # Claude step, after the build, so without this anyone's @claude comment on this public repo
    # would start a job (and build a fork's code) before being refused.
    if: |
      github.actor == 'stuartmccoll' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Don't leave this job's read-only GITHUB_TOKEN in git's config. Git sends that saved
          # header ahead of the Claude app token the action puts in the remote URL, so Claude's
          # pushes went out as github-actions[bot] and were refused with a 403.
          persist-credentials: false

      # CLAUDE.md asks for every change to be verified by building with zero warnings and running
      # the tests, so give Claude the same toolchain CI uses (see ci.yml).
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Builds once up front, so Claude's own builds are incremental and Playwright's script exists.
      - name: Build
        run: dotnet build --configuration Debug

      # The browser tests need Chromium and its system libraries, as in ci.yml's browser job.
      - name: Install Chromium
        run: pwsh tests/Ancilla.Web.E2E/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Let Claude verify its own work the way CLAUDE.md asks: build, test, privacy check.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: >-
            --allowed-tools
            "Bash(dotnet restore *)"
            "Bash(dotnet build *)"
            "Bash(dotnet build)"
            "Bash(dotnet test *)"
            "Bash(dotnet test)"
            "Bash(.github/scripts/privacy-check.sh)"

