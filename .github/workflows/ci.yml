name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Privacy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No tokens, XUIDs, film data or machine paths
        run: .github/scripts/privacy-check.sh

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      # CLAUDE.md asks for a build with zero warnings, so any warning fails CI.
      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror
      # The tests use synthetic films only; nothing here needs a Spartan token.
      - name: Test
        run: dotnet test --no-build --configuration Release
