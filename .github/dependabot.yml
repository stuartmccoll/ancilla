# Keeps NuGet packages (Ancilla.UI's Blazor and Microsoft.Extensions packages, Ancilla.Data's SQLite, and the
# test projects': xUnit, bUnit, Playwright, axe and friends) and the GitHub Actions used by CI up to date.
# The desktop app's MAUI packages follow the installed workload ($(MauiVersion)), so they update with it.
# Minor and patch updates for each ecosystem arrive as one grouped PR a week; major updates get their
# own PR, since they can need code changes.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
